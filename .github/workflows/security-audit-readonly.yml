name: Security Audit Readonly

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployed-api-readonly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe deployed Apps Script without mutations
        shell: python
        run: |
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          source = Path("catalogo-oficial-v71.js").read_text(encoding="utf-8")
          match = re.search(r"https://script\.google\.com/macros/s/[^'\"\\s]+/exec", source)
          if not match:
              raise SystemExit("Apps Script endpoint not found in source")
          api = match.group(0)

          def get(params):
              url = api + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={"User-Agent": "Cora-Security-Audit/1.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          def post_noop(payload):
              body = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  api,
                  data=body,
                  method="POST",
                  headers={
                      "User-Agent": "Cora-Security-Audit/1.0",
                      "Content-Type": "text/plain;charset=utf-8",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          ping = get({"action": "ping"})
          print("PING_OK=" + str(bool(ping.get("ok"))).lower())

          # Resumo is intentionally outside the new source-code read allowlist.
          # Only print boolean/count metadata; never print row contents.
          resumo = get({"action": "listar", "aba": "Resumo"})
          print("ARBITRARY_SHEET_LISTABLE=" + str(bool(resumo.get("ok"))).lower())
          print("ARBITRARY_SHEET_ROW_COUNT=" + str(len(resumo.get("rows") or [])))

          # Invalid/missing IDs force validation failure before any sheet write.
          # This proves route recognition only; it must never create or modify records.
          save_probe = post_noop({"action": "salvarRegistro", "aba": "Resumo", "id": ""})
          save_msg = str(save_probe.get("mensagem") or "")
          print("POST_SALVAR_REGISTRO_RECOGNIZED=" + str("desconhecida" not in save_msg.lower()).lower())

          batch_probe = post_noop({"action": "salvarLote", "registros": []})
          batch_msg = str(batch_probe.get("mensagem") or "")
          print("POST_SALVAR_LOTE_RECOGNIZED=" + str("desconhecida" not in batch_msg.lower()).lower())

          pdf_probe = post_noop({"action": "salvarPdfOrcamento", "id": ""})
          pdf_msg = str(pdf_probe.get("mensagem") or "")
          print("POST_PDF_ROUTE_RECOGNIZED=" + str("desconhecida" not in pdf_msg.lower()).lower())

          pdf64_probe = post_noop({"action": "salvarPdfBase64", "id": "", "pdfBase64": ""})
          pdf64_msg = str(pdf64_probe.get("mensagem") or "")
          print("POST_PDF_BASE64_ROUTE_RECOGNIZED=" + str("desconhecida" not in pdf64_msg.lower()).lower())

          audit = get({"action": "auditarCatalogo"})
          counts = audit.get("auditoria") or {}
          print("CATALOG_AUDIT_OK=" + str(bool(audit.get("ok"))).lower())
          for key in ("total", "aprovadosPublicados", "rascunhos", "relatorioCompleto"):
              print(f"CATALOG_{key.upper()}={counts.get(key, 'n/a')}")
      - name: Inspect production HTTP security headers
        shell: python
        run: |
          import urllib.request

          targets = {
              "cora-gestao-netlify": "https://cora-gestao.netlify.app/",
              "cora-atendimento-netlify": "https://cora-atendimento.netlify.app/",
              "cora-familia-pages": "https://diegofreitas09.github.io/cora-familia/",
          }
          wanted = [
              "strict-transport-security",
              "content-security-policy",
              "x-content-type-options",
              "referrer-policy",
              "permissions-policy",
              "cross-origin-opener-policy",
              "cross-origin-resource-policy",
              "x-frame-options",
          ]
          for name, url in targets.items():
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Cora-Security-Audit/1.0"})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      headers = {k.lower(): v for k, v in response.headers.items()}
                      print(f"HTTP_TARGET={name}")
                      print(f"HTTP_STATUS={response.status}")
                      print(f"HTTP_FINAL_HTTPS={str(response.geturl().startswith('https://')).lower()}")
                      for key in wanted:
                          print(f"HEADER_{key.upper().replace('-', '_')}={str(bool(headers.get(key))).lower()}")
              except Exception as exc:
                  print(f"HTTP_TARGET={name}")
                  print("HTTP_PROBE_ERROR=" + type(exc).__name__)

