name: Limpar crédito duplicado

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pdf-credit-css-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover bloco CSS duplicado
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.css')
          css=p.read_text(encoding='utf-8')
          marker='/* ===== CRÉDITO PDF SOLUÇÃO EDUCACIONAL ===== */'
          if marker in css:
              css=css.split(marker,1)[0].rstrip()+'\n'
              p.write_text(css,encoding='utf-8')
          PY
      - name: Publicar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "PDF Solução Educacional"
          git config user.email "actions@users.noreply.github.com"
          git add app.css
          git commit -m "fix: remover crédito visual duplicado no Cora Gestão"
          git push
